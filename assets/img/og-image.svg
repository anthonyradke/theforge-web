<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0F11"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="55%">
      <stop offset="0" stop-color="#D8232A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D8232A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#CFD2D7"/>
      <stop offset=".55" stop-color="#82878F"/>
      <stop offset=".72" stop-color="#EDEFF2"/>
      <stop offset="1" stop-color="#737880"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mark -->
  <image href="logo.png" x="840" y="190" width="300" height="226"/>

  <g font-family="Anton, 'Arial Narrow', Impact, sans-serif" text-transform="uppercase">
    <rect x="84" y="140" width="54" height="4" fill="#D8232A"/>
    <text x="150" y="148" fill="#D8232A" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
          font-size="24" font-weight="700" letter-spacing="7">GREENVILLE, SOUTH CAROLINA</text>

    <text x="84" y="268" fill="url(#steel)" font-size="104" letter-spacing="1">FORGED IN FAITH.</text>
    <text x="84" y="376" fill="#D8232A" font-size="104" letter-spacing="1">BUILT IN STRENGTH.</text>

    <text x="84" y="452" fill="#EDEBE6" font-size="58" letter-spacing="2">THE FORGE STRENGTH CLUB</text>
  </g>

  <rect x="84" y="500" width="3" height="60" fill="#D8232A"/>
  <text x="106" y="527" fill="#B9B7B1" font-family="Inter, system-ui, sans-serif" font-size="22"
        font-style="italic">&#8220;As iron sharpens iron, so one person sharpens another.&#8221;</text>
  <text x="106" y="554" fill="#8B9099" font-family="'Barlow Condensed', sans-serif" font-size="19"
        font-weight="700" letter-spacing="4">PROVERBS 27:17</text>
</svg>
